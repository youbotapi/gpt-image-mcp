name: Publish to npm

# Runs when you click "Publish release" on the GitHub Releases page.
#
# Phase 1 (first publish): needs one repository secret, NPM_TOKEN
#   (an npm "Automation" token — it bypasses 2FA, which is what CI needs).
# Phase 2 (after the package exists): configure a Trusted Publisher on
#   npmjs.com → the package → Settings → Trusted publishing, pointing at
#   youbotapi/gpt-image-mcp and publish.yml. Then delete NPM_TOKEN here
#   and revoke it on npm — OIDC below takes over and provenance becomes
#   automatic.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC and for provenance attestation
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which is what OIDC publishing needs in phase 2.
      # No dependency cache here on purpose: a release build should resolve clean.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Skip rather than fail when this version is already on npm, so the whole
      # workflow can be re-run safely — which matters because the registry step
      # below is the part most likely to need a retry.
      # NODE_AUTH_TOKEN is ignored once a Trusted Publisher is configured.
      - name: Publish to npm if this version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — skipping publish"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The Official MCP Registry is the upstream that other directories and
      # MCP clients read from, so listing there is what actually gets the
      # server discovered. Authentication is OIDC from this workflow — no
      # token, nothing to rotate.
      - name: Publish to the Official MCP Registry
        run: |
          # Keep server.json's versions in step with package.json rather than
          # trusting two files to be edited together.
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            server.version = version;
            for (const p of server.packages) p.version = version;
            fs.writeFileSync("server.json", JSON.stringify(server, null, 2) + "\n");
            console.log("server.json set to", version);
          '
          # The registry verifies the version really exists on npm before it
          # will register it. npm's CDN lags a publish by 1-4 minutes, so wait
          # for the version to actually resolve instead of racing it.
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 24); do
            if curl -fsS "https://registry.npmjs.org/$NAME/$VERSION" > /dev/null; then
              echo "npm is serving $NAME@$VERSION"
              break
            fi
            echo "waiting for npm to serve $NAME@$VERSION ($i/24)"
            sleep 15
          done

          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
